<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Friend Recommendation with Graph Neural Networks{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <h1>Friend Recommendation with Graph Neural Networks</h1>
    <nav>
      <a href="{{ url_for('home') }}" class="{{ 'active' if page == 'graph' else '' }}">Network Explorer</a>
      <a href="{{ url_for('results') }}" class="{{ 'active' if page == 'results' else '' }}">Results</a>
    </nav>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
